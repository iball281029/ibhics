name: Installer ISO

# Builds the installer from the current Debian 13 netinst ISO: on pull requests that
# touch the installer, by hand from the Actions tab, and for tags such as v0.1.0-beta
# (which also attach the ISO to a pre-release).
on:
  workflow_dispatch:
  pull_request:
    paths: ["installer/**", ".github/workflows/iso.yml"]
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the ISO to a release on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xorriso
      - run: installer/build-iso.sh
      - name: Check that both BIOS and UEFI boot entries survived
        run: |
          report=$(xorriso -indev dist/ibhics-*-amd64.iso -report_el_torito plain 2>&1)
          echo "$report"
          echo "$report" | grep -q "El Torito boot img :   1  BIOS"
          echo "$report" | grep -q "El Torito boot img :   2  UEFI"
          xorriso -indev dist/ibhics-*-amd64.iso -find /ibhics/wheelhouse -name 'ibhics-*.whl' 2>/dev/null | grep -q ibhics
      - uses: actions/upload-artifact@v4
        with:
          name: ibhics-installer-iso
          path: dist/
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/ibhics-*
