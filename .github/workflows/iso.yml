name: Installer ISO

# Builds the installer from the current Debian 13 netinst ISO: on pull requests that
# touch the installer, by hand from the Actions tab, and for tags such as v0.1.0-beta
# (which also attach the ISO to a pre-release).
on:
  workflow_dispatch:
  pull_request:
    paths: ["installer/**", ".github/workflows/iso.yml"]
  push:
    tags: ["v*"]

jobs:
  packages:
    # Every package the preseed installs must exist in Debian 13, or the install stops
    # at "Select and install software".
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Simulate installing the preseed's package list
        run: |
          pkgs=$(sed -n '/^d-i pkgsel\/include/,/^[^ ]/p' installer/preseed.cfg \
            | sed 's/^d-i pkgsel\/include string//; s/\\//g' | grep -v '^d-i\|^popularity' | xargs)
          echo "packages: $pkgs"
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update -q
          apt-get install --simulate -q $pkgs > /dev/null

  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the ISO to a release on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xorriso
      - run: installer/build-iso.sh
      - name: Check that both BIOS and UEFI boot entries survived
        run: |
          report=$(xorriso -indev dist/ibhics-*-amd64.iso -report_el_torito plain 2>&1)
          echo "$report"
          echo "$report" | grep -Eq "boot img : +[0-9]+ +BIOS"
          echo "$report" | grep -Eq "boot img : +[0-9]+ +UEFI"
          xorriso -indev dist/ibhics-*-amd64.iso -find /ibhics/wheelhouse -name 'ibhics-*.whl' 2>/dev/null | grep -q ibhics
      - uses: actions/upload-artifact@v4
        with:
          name: ibhics-installer-iso
          path: dist/
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/ibhics-*

  install-test:
    # Installs the ISO end to end in QEMU and checks the web console of the new node.
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ibhics-installer-iso
          path: dist
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils lvm2
      - run: installer/test-install.sh dist/ibhics-*-amd64.iso
      - name: Screenshots of the VM
        if: always()
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          for f in install-test/shots/*.ppm; do [ -e "$f" ] && convert "$f" "${f%.ppm}.png" && rm "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-screens
          path: install-test/shots/
          retention-days: 14

