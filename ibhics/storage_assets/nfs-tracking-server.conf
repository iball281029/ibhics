[Service]
# The OCF nfsserver resource has already bound the replicated state directory.
# Replace any tracker that started earlier against the hidden local directory.
ExecStartPre=/usr/local/libexec/ibhics-nfs-tracking prepare
ExecStartPre=/usr/bin/systemctl restart nfsdcld.service
ExecStartPost=/usr/local/libexec/ibhics-nfs-tracking verify
