<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ibHiCS Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5b6475; --line: #dde1e8;
    --accent: #1f6feb; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a303b;
      --accent: #4c8dff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Noto Sans Thai", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header .host { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .state { font-weight: 600; }
  .state.running { color: var(--ok); } .state.stopped { color: var(--muted); } .state.paused { color: var(--warn); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  input, select { width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  #msg { min-height: 20px; color: var(--bad); }
  .empty { color: var(--muted); padding: 16px 8px; }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <h1>ibHiCS Console</h1>
  <div class="host" id="host">กำลังโหลด…</div>
</header>
<main>
  <section>
    <h2>สร้าง VM ใหม่</h2>
    <form id="create">
      <label>ชื่อ VM <input name="name" required pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{0,62}" placeholder="web-01"></label>
      <label>vCPU <input name="vcpus" type="number" min="1" value="2"></label>
      <label>RAM (MB) <input name="memory_mb" type="number" min="128" step="128" value="2048"></label>
      <label>ดิสก์ (GB) <input name="disk_gb" type="number" min="1" value="40"></label>
      <label>Storage pool <input name="pool" value="default" list="pool-names"></label>
      <datalist id="pool-names"></datalist>
      <label>Firmware
        <select name="firmware"><option value="bios">BIOS</option><option value="uefi">UEFI</option></select>
      </label>
      <label>Network <input name="network" value="default"></label>
      <label>Node <select name="node" id="node-select"><option value="">อัตโนมัติ</option></select></label>
      <button class="primary" type="submit">สร้าง VM</button>
    </form>
    <div id="msg"></div>
  </section>
  <section>
    <h2>Nodes</h2>
    <table>
      <thead><tr><th>ชื่อ</th><th>Role</th><th class="hide-sm">Address</th><th>สถานะ</th><th></th></tr></thead>
      <tbody id="nodes"></tbody>
    </table>
    <h2 style="margin-top:16px">เพิ่ม node เข้า cluster</h2>
    <form id="join">
      <label>ชื่อ node <input name="name" required placeholder="node2"></label>
      <label>Role
        <select name="role"><option value="compute">compute</option><option value="witness">witness</option></select>
      </label>
      <label>Agent URL <input name="address" required placeholder="http://10.0.0.12:8007"></label>
      <button type="submit">เพิ่ม node</button>
    </form>
  </section>
  <section>
    <h2>Storage</h2>
    <table>
      <thead><tr><th>Node</th><th>Pool</th><th>ชนิด</th><th class="hide-sm">ที่มา</th><th>ใช้ / ทั้งหมด</th><th></th></tr></thead>
      <tbody id="pools"></tbody>
    </table>
    <h2 style="margin-top:16px">เพิ่ม storage pool</h2>
    <form id="pool-form">
      <label>Node <select name="node" class="node-list" required></select></label>
      <label>ชื่อ pool <input name="name" required placeholder="nas01"></label>
      <label>ชนิด
        <select name="type" id="pool-type">
          <option value="dir">Local directory</option>
          <option value="nfs">NFS</option>
          <option value="iscsi">iSCSI (LVM บน LUN)</option>
          <option value="lvm">FC / local disk (LVM)</option>
        </select>
      </label>
      <label data-for="dir">Path (ว่าง = ค่าเริ่มต้น) <input name="path" placeholder="/var/lib/ibhics/pools/..."></label>
      <label data-for="nfs iscsi">Server / Portal <input name="host" placeholder="10.0.0.50"></label>
      <label data-for="nfs">Export <input name="export" placeholder="/vol/vms"></label>
      <label data-for="iscsi">Target IQN <input name="iqn" placeholder="iqn.2004-04.com.example:lun1"></label>
      <label data-for="iscsi">LUN <input name="lun" type="number" min="0" value="0"></label>
      <label data-for="lvm">Device <input name="device" placeholder="/dev/mapper/mpatha"></label>
      <label data-for="iscsi lvm" class="wipe"><span><input name="confirm_wipe" type="checkbox" style="width:auto"> ยืนยันว่าลบข้อมูลบน device ได้</span></label>
      <button type="submit">เพิ่ม pool</button>
    </form>
  </section>
  <section>
    <h2>Virtual Machines</h2>
    <table>
      <thead><tr><th>ชื่อ</th><th>Node</th><th>สถานะ</th><th>vCPU</th><th>RAM</th><th class="hide-sm">ดิสก์</th><th></th></tr></thead>
      <tbody id="vms"></tbody>
    </table>
  </section>
</main>
<script>
const api = (path, opts = {}) =>
  fetch(`/api/v1${path}`, { headers: { "Content-Type": "application/json" }, ...opts }).then(async (r) => {
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      const detail = Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join(", ") : body.detail;
      throw new Error(detail || r.statusText);
    }
    return r.status === 204 ? null : r.json();
  });

const msg = (text) => { document.getElementById("msg").textContent = text || ""; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const TOPOLOGY = {
  "standalone": "Standalone (node เดียว)",
  "two-node-witness": "2 node + witness",
  "cluster": "Cluster",
  "incomplete": "ยังไม่ครบ (ไม่มี HA)",
};

async function loadCluster() {
  const c = await api("/cluster");
  document.getElementById("host").textContent =
    `${TOPOLOGY[c.topology] || c.topology} · ${c.members.length} node · ` +
    (c.quorum ? "quorum OK" : "เสีย quorum: สั่งงานไม่ได้");
  document.getElementById("nodes").innerHTML = c.members.map((m) => `
    <tr>
      <td>${esc(m.name)}${m.local ? " (manager)" : ""}</td>
      <td>${esc(m.role)}</td>
      <td class="hide-sm">${esc(m.address || "local")}</td>
      <td class="state ${m.healthy ? "running" : "paused"}">${m.healthy ? "online" : "offline"}</td>
      <td>${m.local ? "" : `<button class="danger" data-node="${esc(m.name)}">นำออก</button>`}</td>
    </tr>`).join("");
  const select = document.getElementById("node-select");
  const keep = select.value;
  select.innerHTML = '<option value="">อัตโนมัติ</option>' + c.members
    .filter((m) => m.role === "compute" && m.healthy)
    .map((m) => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("");
  select.value = keep;
  for (const list of document.querySelectorAll(".node-list")) {
    const prev = list.value;
    list.innerHTML = c.members.filter((m) => m.role === "compute" && m.healthy)
      .map((m) => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("");
    if (prev) list.value = prev;
  }
}

const POOL_TYPES = { dir: "Local", nfs: "NFS", iscsi: "iSCSI", lvm: "LVM (FC/disk)" };

async function loadPools() {
  const pools = await api("/pools");
  document.getElementById("pools").innerHTML = pools.map((p) => `
    <tr>
      <td>${esc(p.node)}</td>
      <td>${esc(p.name)}</td>
      <td>${esc(POOL_TYPES[p.type] || p.type)}</td>
      <td class="hide-sm">${esc(p.source)}</td>
      <td>${p.allocation_gb} / ${p.capacity_gb} GB</td>
      <td><button class="danger" data-pool="${esc(p.name)}" data-node="${esc(p.node)}">นำออก</button></td>
    </tr>`).join("");
  const names = [...new Set(pools.map((p) => p.name))];
  document.getElementById("pool-names").innerHTML = names.map((n) => `<option value="${esc(n)}">`).join("");
}

function showPoolFields() {
  const type = document.getElementById("pool-type").value;
  for (const el of document.querySelectorAll("#pool-form [data-for]")) {
    el.style.display = el.dataset.for.split(" ").includes(type) ? "" : "none";
  }
}
document.getElementById("pool-type").addEventListener("change", showPoolFields);
showPoolFields();

document.getElementById("pool-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const type = f.get("type");
  const body = { name: f.get("name"), type, confirm_wipe: f.get("confirm_wipe") === "on" };
  if (type === "dir" && f.get("path")) body.path = f.get("path");
  if (type === "nfs" || type === "iscsi") body.host = f.get("host");
  if (type === "nfs") body.export = f.get("export");
  if (type === "iscsi") { body.iqn = f.get("iqn"); body.lun = Number(f.get("lun")); }
  if (type === "lvm") body.device = f.get("device");
  if (body.confirm_wipe && !confirm("ข้อมูลทั้งหมดบน device นี้จะถูกลบ ดำเนินการต่อ?")) return;
  msg();
  try {
    await api(`/nodes/${encodeURIComponent(f.get("node"))}/pools`, { method: "POST", body: JSON.stringify(body) });
    e.target.reset();
    showPoolFields();
    await loadPools();
  } catch (err) { msg(err.message); }
});

document.getElementById("pools").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-pool]");
  if (!btn || !confirm(`นำ pool ${btn.dataset.pool} ออกจาก ${btn.dataset.node}? (ข้อมูลบน storage จะยังอยู่)`)) return;
  msg();
  try {
    await api(`/nodes/${encodeURIComponent(btn.dataset.node)}/pools/${encodeURIComponent(btn.dataset.pool)}`, { method: "DELETE" });
    await loadPools();
  } catch (err) { msg(err.message); }
});

async function loadVMs() {
  const vms = await api("/vms");
  const tbody = document.getElementById("vms");
  if (!vms.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">ยังไม่มี VM</td></tr>';
    return;
  }
  tbody.innerHTML = vms.map((vm) => `
    <tr>
      <td>${esc(vm.name)}</td>
      <td>${esc(vm.node || "")}</td>
      <td class="state ${esc(vm.state)}">${esc(vm.state)}</td>
      <td>${vm.vcpus}</td>
      <td>${vm.memory_mb} MB</td>
      <td class="hide-sm">${vm.disks.map((d) => `${d.size_gb} GB`).join(", ")}</td>
      <td class="actions">
        ${vm.state === "running"
          ? `<button data-act="stop" data-id="${vm.uuid}">Shutdown</button>
             <button data-act="poweroff" data-id="${vm.uuid}">Power off</button>`
          : `<button data-act="start" data-id="${vm.uuid}">Start</button>
             <button class="danger" data-act="delete" data-id="${vm.uuid}">ลบ</button>`}
      </td>
    </tr>`).join("");
}

document.getElementById("vms").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const { act, id } = btn.dataset;
  msg();
  try {
    if (act === "start") await api(`/vms/${id}/start`, { method: "POST" });
    if (act === "stop") await api(`/vms/${id}/stop`, { method: "POST", body: "{}" });
    if (act === "poweroff") await api(`/vms/${id}/stop`, { method: "POST", body: '{"force": true}' });
    if (act === "delete") {
      if (!confirm("ลบ VM และดิสก์ทั้งหมด?")) return;
      await api(`/vms/${id}`, { method: "DELETE" });
    }
    await loadVMs();
    await loadPools();
  } catch (err) { msg(err.message); }
});

document.getElementById("create").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  msg();
  try {
    await api("/vms", {
      method: "POST",
      body: JSON.stringify({
        name: f.get("name"),
        vcpus: Number(f.get("vcpus")),
        memory_mb: Number(f.get("memory_mb")),
        firmware: f.get("firmware"),
        disks: [{ size_gb: Number(f.get("disk_gb")), pool: f.get("pool") || "default" }],
        nics: [{ network: f.get("network") }],
        node: f.get("node") || null,
      }),
    });
    e.target.reset();
    await loadVMs();
    await loadPools();
  } catch (err) { msg(err.message); }
});

document.getElementById("nodes").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-node]");
  if (!btn || !confirm(`นำ ${btn.dataset.node} ออกจาก cluster?`)) return;
  msg();
  try {
    await api(`/cluster/nodes/${encodeURIComponent(btn.dataset.node)}`, { method: "DELETE" });
    await loadCluster();
  } catch (err) { msg(err.message); }
});

document.getElementById("join").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  msg();
  try {
    await api("/cluster/nodes", {
      method: "POST",
      body: JSON.stringify({ name: f.get("name"), role: f.get("role"), address: f.get("address") }),
    });
    e.target.reset();
    await loadCluster();
  } catch (err) { msg(err.message); }
});

loadCluster().catch((err) => msg(err.message));
loadPools().catch((err) => msg(err.message));
setInterval(() => { loadCluster().catch(() => {}); loadVMs().catch(() => {}); }, 10000);
loadVMs().catch((err) => msg(err.message));
</script>
</body>
</html>
