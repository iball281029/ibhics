<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM Console</title>
<style>
  :root { --bar: #171b23; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a303b; --ok: #3fb950; --bad: #f85149; --warn: #d29922; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--text); font: 13px/1.4 system-ui, "Noto Sans Thai", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header strong { margin-right: 8px; }
  #status { color: var(--muted); margin-right: auto; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); } #status.wait { color: var(--warn); }
  button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #232936; color: var(--text); cursor: pointer; font: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  #screen { flex: 1; min-height: 0; overflow: hidden; }
  #kbd { display: none; flex-direction: column; gap: 4px; padding: 6px 8px; background: var(--bar); border-top: 1px solid var(--line); }
  #kbd.open { display: flex; }
  #kbd .row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  #kbd button { min-width: 34px; padding: 6px 7px; }
  #kbd button.wide { min-width: 64px; } #kbd button.space { min-width: 220px; }
  #kbd button.on { background: #1f6feb; border-color: #1f6feb; }
</style>
</head>
<body>
<header>
  <strong id="title">VM Console</strong>
  <span id="status" class="wait">Connecting…</span>
  <button id="cad" disabled>Ctrl+Alt+Del</button>
  <button id="kbd-btn" title="On-screen keyboard: Esc, Tab, F1–F12, Ctrl/Alt/Win and more">Keyboard</button>
  <button id="paste" disabled title="Type the clipboard text into the VM">Paste text</button>
  <button id="release" disabled title="Send key-up for Shift, Ctrl, Alt and Meta if the VM acts as if one is stuck">Release keys</button>
  <button id="full">Fullscreen</button>
  <button id="reconnect">Reconnect</button>
</header>
<div id="screen"></div>
<div id="kbd" aria-label="On-screen keyboard"></div>
<script type="module">
import RFB from "./novnc/core/rfb.js";

const params = new URLSearchParams(location.search);
const uuid = params.get("vm") || "";
const name = params.get("name") || uuid;
document.title = `${name} · Console`;
document.getElementById("title").textContent = name;

const status = document.getElementById("status");
const setStatus = (text, cls) => { status.textContent = text; status.className = cls; };
const buttons = ["cad", "paste", "release"].map((id) => document.getElementById(id));
let rfb = null;

function connect() {
  if (rfb) rfb.disconnect();
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const url = `${scheme}://${location.host}/api/v1/vms/${encodeURIComponent(uuid)}/console`;
  setStatus("Connecting…", "wait");
  rfb = new RFB(document.getElementById("screen"), url);
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.addEventListener("connect", () => {
    setStatus("Connected", "ok");
    buttons.forEach((b) => { b.disabled = false; });
    rfb.focus();
  });
  rfb.addEventListener("disconnect", (e) => {
    buttons.forEach((b) => { b.disabled = true; });
    setStatus(e.detail.clean ? "Disconnected" : "Cannot connect (the VM may be off or its node unreachable)", "bad");
  });
  rfb.addEventListener("desktopname", (e) => { if (!params.get("name")) document.title = e.detail.name; });
}

document.getElementById("cad").addEventListener("click", () => rfb && rfb.sendCtrlAltDel());
document.getElementById("reconnect").addEventListener("click", connect);

// On-screen keyboard: keys a browser keeps for itself (Esc, F11, Ctrl+Alt+...), and
// tablets. Ctrl, Alt, Shift and Win stay down for the next key, like sticky keys.
const K = (label, keysym, code, cls = "") => ({ label, keysym, code, cls });
const fkeys = Array.from({ length: 12 }, (_, i) => K(`F${i + 1}`, 0xffbe + i, `F${i + 1}`));
const chars = (text) => [...text].map((c) => K(c, c.charCodeAt(0), /[a-z]/.test(c) ? `Key${c.toUpperCase()}` : /[0-9]/.test(c) ? `Digit${c}` : ""));
const MODS = { Ctrl: [0xffe3, "ControlLeft"], Alt: [0xffe9, "AltLeft"], Shift: [0xffe1, "ShiftLeft"], Win: [0xffeb, "MetaLeft"] };
const ROWS = [
  [K("Esc", 0xff1b, "Escape"), ...fkeys, K("PrtSc", 0xff61, "PrintScreen"), K("Ctrl+Alt+Del", 0, "cad", "wide")],
  [...chars("1234567890"), K("-", 0x2d, "Minus"), K("=", 0x3d, "Equal"), K("⌫", 0xff08, "Backspace", "wide")],
  [K("Tab", 0xff09, "Tab", "wide"), ...chars("qwertyuiop"), K("Ins", 0xff63, "Insert"), K("Del", 0xffff, "Delete")],
  [...chars("asdfghjkl"), K(";", 0x3b, "Semicolon"), K("Enter", 0xff0d, "Enter", "wide"), K("Home", 0xff50, "Home"), K("End", 0xff57, "End")],
  [...chars("zxcvbnm"), K(",", 0x2c, "Comma"), K(".", 0x2e, "Period"), K("/", 0x2f, "Slash"), K("PgUp", 0xff55, "PageUp"), K("PgDn", 0xff56, "PageDown")],
  [...Object.keys(MODS).map((m) => K(m, 0, `mod:${m}`, "wide")), K("Space", 0x20, "Space", "space"),
    K("←", 0xff51, "ArrowLeft"), K("↑", 0xff52, "ArrowUp"), K("↓", 0xff54, "ArrowDown"), K("→", 0xff53, "ArrowRight")],
];
const kbd = document.getElementById("kbd");
const keys = ROWS.flat();
kbd.innerHTML = ROWS.map((row) => `<div class="row">${row.map((k) =>
  `<button type="button" data-k="${keys.indexOf(k)}" class="${k.cls}">${k.label.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</button>`).join("")}</div>`).join("");
const held = new Set();
kbd.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus on the screen
kbd.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b || !rfb) return;
  const k = keys[Number(b.dataset.k)];
  if (k.code === "cad") { rfb.sendCtrlAltDel(); return; }
  if (k.code.startsWith("mod:")) {
    const m = k.code.slice(4);
    if (held.has(m)) held.delete(m); else held.add(m);
    b.classList.toggle("on", held.has(m));
    return;
  }
  for (const m of held) rfb.sendKey(MODS[m][0], MODS[m][1], true);
  rfb.sendKey(k.keysym, k.code || null, true);
  rfb.sendKey(k.keysym, k.code || null, false);
  for (const m of [...held].reverse()) rfb.sendKey(MODS[m][0], MODS[m][1], false);
  held.clear();
  kbd.querySelectorAll("button.on").forEach((x) => x.classList.remove("on"));
  rfb.focus();
});
document.getElementById("kbd-btn").addEventListener("click", (e) => {
  kbd.classList.toggle("open");
  e.currentTarget.classList.toggle("on", kbd.classList.contains("open"));
  if (rfb) rfb.focus();
});
document.getElementById("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
});
// The VM sees key presses, not characters: QEMU turns each key into a scancode for a US
// keyboard and ignores what character it was meant to be. So "$" has to be typed as
// Shift+4, "A" as Shift+A, and so on.
const US_KEYS = (() => {
  const keys = {};
  for (const c of "abcdefghijklmnopqrstuvwxyz") {
    keys[c] = [`Key${c.toUpperCase()}`, false];
    keys[c.toUpperCase()] = [`Key${c.toUpperCase()}`, true];
  }
  "0123456789".split("").forEach((d) => { keys[d] = [`Digit${d}`, false]; });
  ")!@#$%^&*(".split("").forEach((c, d) => { keys[c] = [`Digit${d}`, true]; });
  const pairs = [["-", "_", "Minus"], ["=", "+", "Equal"], ["[", "{", "BracketLeft"], ["]", "}", "BracketRight"],
    ["\\", "|", "Backslash"], [";", ":", "Semicolon"], ["'", '"', "Quote"], ["`", "~", "Backquote"],
    [",", "<", "Comma"], [".", ">", "Period"], ["/", "?", "Slash"]];
  for (const [plain, shifted, code] of pairs) { keys[plain] = [code, false]; keys[shifted] = [code, true]; }
  keys[" "] = ["Space", false];
  keys["\n"] = ["Enter", false];
  keys["\t"] = ["Tab", false];
  return keys;
})();
const KEYSYM = { "\n": 0xff0d, "\t": 0xff09 };
const SHIFT = 0xffe1;
const pause = (ms) => new Promise((r) => setTimeout(r, ms));
const KEY_GAP = 8, LINE_GAP = 80;
// Key-up for every modifier, whatever the guest thinks is held. Harmless when none is.
const MODIFIER_UPS = [[0xffe1, "ShiftLeft"], [0xffe2, "ShiftRight"], [0xffe3, "ControlLeft"],
  [0xffe4, "ControlRight"], [0xffe9, "AltLeft"], [0xffea, "AltRight"], [0xffe7, "MetaLeft"], [0xffe8, "MetaRight"]];
function releaseModifiers() {
  if (!rfb) return;
  for (const [keysym, code] of MODIFIER_UPS) rfb.sendKey(keysym, code, false);
}

document.getElementById("paste").addEventListener("click", async () => {
  // Types the clipboard text as key presses, for guests without a clipboard agent.
  let text = "";
  try { text = await navigator.clipboard.readText(); } catch { text = prompt("Text to type into the VM") || ""; }
  text = text.replace(/\r\n?/g, "\n");
  const button = document.getElementById("paste");
  button.disabled = true;
  let skipped = 0;
  try {
    for (const ch of text) {
      const key = US_KEYS[ch];
      if (!key || !rfb) { skipped += 1; continue; }
      const [code, shift] = key;
      const keysym = KEYSYM[ch] ?? ch.codePointAt(0);
      // Every event gets its own gap: a guest that misses a Shift release keeps typing
      // capitals after the paste, one that misses a press drops the character.
      if (shift) { rfb.sendKey(SHIFT, "ShiftLeft", true); await pause(KEY_GAP); }
      rfb.sendKey(keysym, code, true);
      await pause(KEY_GAP);
      rfb.sendKey(keysym, code, false);
      await pause(KEY_GAP);
      if (shift) { rfb.sendKey(SHIFT, "ShiftLeft", false); await pause(KEY_GAP); }
      if (ch === "\n") await pause(LINE_GAP);
    }
  } finally {
    releaseModifiers();
    button.disabled = !rfb;
  }
  if (skipped) setStatus(`Typed the text; ${skipped} character(s) have no key on a US keyboard and were left out`, "wait");
  rfb.focus();
});

document.getElementById("release").addEventListener("click", () => {
  releaseModifiers();
  held.clear();
  kbd.querySelectorAll("button.on").forEach((b) => b.classList.remove("on"));
  if (rfb) rfb.focus();
});

if (uuid) connect(); else setStatus("No VM given", "bad");
</script>
</body>
</html>
