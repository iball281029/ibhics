[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibhics"
version = "0.1.0"
description = "Open-source hyper-converged infrastructure platform"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
libvirt = ["libvirt-python>=10.0"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ibhics-manager = "ibhics.manager.__main__:main"

[tool.setuptools.packages.find]
include = ["ibhics*"]

[tool.setuptools.package-data]
"ibhics.manager" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
