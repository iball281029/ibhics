#### ibHiCS 0.1 beta: unattended Debian 13 install.
# The default menu entry erases the FIRST disk without asking. Everything about the
# node (name, address, role, passwords) is asked on first boot by ibhics-setup.

# Language and keyboard; the time zone is set again by ibhics-setup.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Asia/Bangkok
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Network: DHCP for the install only. If there is no DHCP server the installer asks.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ibhics
d-i netcfg/get_domain string local
d-i netcfg/hostname string ibhics

# Packages come from the Debian mirror (a netinst ISO needs internet during install).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true

# root is locked until ibhics-setup sets its password on first boot; no other user.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean false

# Disk: the first disk, GPT, LVM. /var/lib/ibhics (VM disks, backups) takes the rest.
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string ibhics
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/default_label string gpt
d-i partman-basicfilesystems/choose_label string gpt
d-i partman-auto/choose_recipe select ibhics
d-i partman-auto/expert_recipe string                              \
    ibhics ::                                                      \
        1 1 1 free                                                 \
            $bios_boot{ } method{ biosgrub } .                     \
        538 538 1075 free                                          \
            $iflabel{ gpt } $reusemethod{ }                        \
            method{ efi } format{ } .                              \
        1024 1024 1024 ext4                                        \
            $primary{ } $bootable{ } method{ format } format{ }    \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } . \
        30720 30720 30720 ext4                                     \
            $lvmok{ } lv_name{ root } method{ format } format{ }   \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
        8192 8192 8192 linux-swap                                  \
            $lvmok{ } lv_name{ swap } method{ swap } format{ } .   \
        20480 100000 -1 xfs                                        \
            $lvmok{ } lv_name{ data } method{ format } format{ }   \
            use_filesystem{ } filesystem{ xfs }                    \
            mountpoint{ /var/lib/ibhics } .
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Software: a minimal system plus KVM, libvirt and the storage clients ibHiCS uses.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string \
    qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients ovmf \
    python3 python3-venv python3-libvirt \
    nfs-common cifs-utils open-iscsi lvm2 multipath-tools xfsprogs \
    bridge-utils chrony openssl curl ca-certificates \
    virt-v2v
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader on the disk we installed to.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Install ibHiCS itself from the ISO, offline.
d-i preseed/late_command string \
    cp -r /cdrom/ibhics /target/opt/ibhics-installer; \
    in-target sh /opt/ibhics-installer/install-ibhics.sh

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
