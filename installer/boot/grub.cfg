# UEFI boot menu of the ibHiCS installer (replaces Debian's /boot/grub/grub.cfg on the ISO).
set timeout=10
set default=0
set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan

menuentry 'Install ibHiCS (erases the first disk)' {
    linux  /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/ibhics/preseed.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}
menuentry 'Install ibHiCS, choose disk and network by hand' {
    linux  /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/ibhics/preseed.cfg vga=788 ---
    initrd /install.amd/initrd.gz
}
menuentry 'Rescue mode' {
    linux  /install.amd/vmlinuz rescue/enable=true vga=788 --- quiet
    initrd /install.amd/initrd.gz
}
