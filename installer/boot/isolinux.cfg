# BIOS boot menu of the ibHiCS installer (replaces Debian's isolinux.cfg on the ISO).
default vesamenu.c32
timeout 100
menu title ibHiCS 0.1 beta installer
menu color title 1;36;40 #ff22d3ee #00000000 std

label ibhics
  menu label ^Install ibHiCS (erases the first disk)
  menu default
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical preseed/file=/cdrom/ibhics/preseed.cfg vga=788 --- quiet

label expert
  menu label Install ibHiCS, ^choose disk and network by hand
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=high preseed/file=/cdrom/ibhics/preseed.cfg vga=788 ---

label rescue
  menu label ^Rescue mode
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz rescue/enable=true vga=788 --- quiet
