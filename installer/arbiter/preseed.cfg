#### Arbiter: offline Debian 13 installation on one dedicated VM disk.
# Boot menu waits for an explicit selection. Network and password are set on first boot.

# Language and keyboard; the time zone is set again by ibhics-setup.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Asia/Bangkok
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# No network during the install: every package is on the ISO (ibhics/repo), and the
# management address is set on first boot by ibhics-setup. So DHCP, cabling and
# internet access do not matter here.
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string arbiter-01
d-i netcfg/get_domain string local
d-i netcfg/hostname string arbiter-01
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# root is locked until ibhics-setup sets its password on first boot; no other user.
# The installer insists on a root password (it asks for one when given "!"), so it gets
# the hash of a random one that nobody knows, and late_command locks the account.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$q9YIU2exN6.RT.iI$YED5ijrOVmFWLPM5hf0IzX9rl.2Kxet6k02Rnvc41RJW4NVGhqdf/u1dKjhPn/BmIJpLE/.5tnQwMtpS/7hyh0
d-i passwd/make-user boolean false

# Exactly one dedicated VM disk, minimum 12 GiB. Existing Arbiter installs are protected.
d-i partman/early_command string \
    disk="$(sh /cdrom/ibhics/pick-disk.sh)" || { while :; do sleep 3600; done; }; \
    if grep -q 'priority=critical' /proc/cmdline && sh /cdrom/ibhics/find-ibhics.sh "$disk"; then \
        sh /cdrom/ibhics/already-installed.sh "$disk"; \
    fi; \
    debconf-set partman-auto/disk "$disk"; \
    debconf-set grub-installer/bootdev "$disk"
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string arbiter-01
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/default_label string gpt
d-i partman-basicfilesystems/choose_label string gpt
d-i partman-auto/choose_recipe select arbiter
d-i partman-auto/expert_recipe string \
    arbiter :: \
        1 1 1 free $bios_boot{ } method{ biosgrub } . \
        538 538 538 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
        1024 1024 1024 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } . \
        1024 1024 1024 linux-swap $lvmok{ } lv_name{ swap } method{ swap } format{ } . \
        8192 10000 -1 ext4 $lvmok{ } lv_name{ root } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Software: only the base system here. install-ibhics.sh (late_command) installs
# installer/packages.txt from the ISO's own repository.
d-i pkgsel/run_tasksel boolean false
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Boot loader on the disk we installed to (set by early_command above).
d-i grub-installer/only_debian boolean true

# Install ibHiCS itself from the ISO, offline.
d-i preseed/late_command string \
    cp -r /cdrom/ibhics /target/opt/ibhics-installer; \
    in-target /bin/bash /opt/ibhics-installer/install.sh || { while :; do sleep 3600; done; }; \
    in-target passwd -l root

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
